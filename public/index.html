<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!--
    CSS の読み込み順。@layer で優先順位を固定しているので、
    custom.css に書いたものは詳細度を気にせず必ず勝ちます。
  -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <h1 class="app-header__title" id="dashboard-title">Dashboard</h1>

      <div class="app-header__search" id="header-search" hidden>
        <input type="search" id="filter" class="input input--search"
               placeholder="リンクを絞り込む（/ キー）" aria-label="リンクを絞り込む" autocomplete="off">
      </div>

      <div class="app-header__actions" id="header-actions" hidden>
        <span class="save-status" id="save-status" role="status" aria-live="polite"></span>
        <button type="button" class="button" id="edit-toggle" aria-pressed="false">
          <span class="button__icon" aria-hidden="true">✎</span><span class="button__label">編集</span>
        </button>
        <button type="button" class="button button--icon" id="settings-open" aria-label="設定" title="設定">⚙</button>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <!-- タブ（タブが 2 つ以上あるとき、または編集中に表示） -->
  <nav class="tabs" id="tabs" hidden></nav>

  <!-- ログイン画面（Firebase の設定が済んでいて、ログインしていないとき） -->
  <section class="signin" id="signin" hidden>
    <div class="signin__card">
      <h2 class="signin__title">ログイン</h2>
      <p class="signin__text">Google アカウントでログインすると、あなたのダッシュボードが表示されます。</p>
      <button type="button" class="button button--primary button--large" id="signin-button">
        Google でログイン
      </button>
    </div>
  </section>

  <main class="dashboard" id="dashboard" aria-live="polite"></main>

  <!-- フッター（画面のいちばん下に固定） -->
  <footer class="app-footer">
    <div class="app-footer__inner">
      <a class="app-footer__link" href="https://github.com/kwaka1208/personal-dashboard" target="_blank" rel="noopener noreferrer">
        <svg class="app-footer__icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        personal-dashboard
      </a>
      <span class="app-footer__spacer"></span>
      <span id="user-email"></span>
      <button type="button" class="button button--small button--ghost" id="signout-button" hidden>ログアウト</button>
    </div>
  </footer>

  <!-- ウィジェットの追加・編集 -->
  <dialog class="dialog" id="widget-dialog">
    <form method="dialog" class="dialog__body" id="widget-form">
      <h2 class="dialog__title" id="widget-dialog-title">ウィジェット</h2>

      <label class="field">
        <span class="field__label">種類</span>
        <select class="input" name="type">
          <option value="links">リンク集</option>
          <option value="note">メモ</option>
          <option value="clock">時計</option>
          <option value="search">Web 検索</option>
          <option value="embed">埋め込み（YouTube・カレンダーなど）</option>
          <option value="todo">ToDo（カテゴリー別）</option>
          <option value="photo">写真（スライドショー）</option>
          <option value="calendar">Google カレンダー（予定の一覧）</option>
          <option value="mail">Gmail（未読の件数）</option>
          <option value="weather">天気</option>
          <option value="timer">タイマー・ポモドーロ</option>
          <option value="worldclock">世界時計</option>
          <option value="habit">習慣トラッカー</option>
          <option value="github">GitHub（プルリクエスト・Issue）</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">タイトル</span>
        <input class="input" name="title" maxlength="80">
      </label>

      <label class="field">
        <span class="field__label">幅</span>
        <select class="input" name="size">
          <option value="s">S（1列）</option>
          <option value="m">M（2列）</option>
          <option value="l">L（3列）</option>
          <option value="xl">XL（全幅）</option>
        </select>
      </label>

      <label class="field" id="widget-page-field">
        <span class="field__label">タブ（別のタブに移すときに変更）</span>
        <select class="input" name="page"></select>
      </label>

      <label class="field">
        <span class="field__label">高さ（タイル表示のとき）</span>
        <select class="input" name="rows">
          <option value="1">1 段</option>
          <option value="2">2 段</option>
          <option value="3">3 段</option>
          <option value="4">4 段</option>
        </select>
        <span class="field__hint" id="size-hint" hidden></span>
      </label>

      <label class="field">
        <span class="field__label">アクセントカラー（任意）</span>
        <span class="field__row">
          <input class="input input--color" type="color" name="accent">
          <label class="checkbox"><input type="checkbox" name="useAccent"> 使う</label>
        </span>
      </label>

      <label class="field" data-for-type="links">
        <span class="field__label">表示形式</span>
        <select class="input" name="view">
          <option value="list">リスト</option>
          <option value="grid">タイル</option>
        </select>
      </label>

      <label class="field" data-for-type="search">
        <span class="field__label">検索 URL（%s が検索語に置き換わります）</span>
        <input class="input" name="searchUrl" placeholder="https://www.google.com/search?q=%s">
      </label>

      <label class="field" data-for-type="embed">
        <span class="field__label">埋め込む URL（YouTube の動画・プレイリストの URL はそのまま貼れます）</span>
        <input class="input" name="embedUrl" type="url" placeholder="https://www.youtube.com/watch?v=...">
        <span class="field__hint" id="embed-url-hint" hidden>YouTube の動画として埋め込みます。高さは幅に合わせて自動で決まります。</span>
      </label>
      <label class="field" data-for-type="embed" id="embed-height-field">
        <span class="field__label">高さ（px。設定の「ウィジェットの高さ」が「中身に合わせる」のときに使います）</span>
        <input class="input" name="height" type="number" min="120" max="1600" step="10">
      </label>

      <label class="field" data-for-type="calendar">
        <span class="field__label">表示する期間</span>
        <select class="input" name="calendarDays">
          <option value="1">今日だけ</option>
          <option value="3">今日から 3 日</option>
          <option value="7">今日から 1 週間</option>
          <option value="14">今日から 2 週間</option>
        </select>
      </label>
      <label class="checkbox" data-for-type="calendar">
        <input type="checkbox" name="allCalendars"> Google カレンダーで表示中のカレンダーをすべて含める（オフにするとメインのカレンダーだけ）
      </label>

      <label class="field" data-for-type="mail">
        <span class="field__label">数える未読</span>
        <select class="input" name="mailLabel">
          <option value="INBOX">受信トレイ</option>
          <option value="CATEGORY_PERSONAL">メイン（受信トレイのタブ）</option>
          <option value="IMPORTANT">重要</option>
          <option value="STARRED">スター付き</option>
        </select>
      </label>

      <!-- 天気 -->
      <label class="field" data-for-type="weather">
        <span class="field__label">地域（市区町村名など。例：東京、大阪市、札幌、London）</span>
        <span class="field__row">
          <input class="input" name="weatherPlace" style="flex: 1; width: auto;" placeholder="東京">
          <button type="button" class="button" id="weather-here">現在地を使う</button>
        </span>
        <input type="hidden" name="weatherLat">
        <input type="hidden" name="weatherLon">
      </label>

      <!-- タイマー・ポモドーロ -->
      <label class="field" data-for-type="timer">
        <span class="field__label">種類</span>
        <select class="input" name="timerMode">
          <option value="pomodoro">ポモドーロ（作業と休憩をくり返す）</option>
          <option value="timer">タイマー（決めた時間を数える）</option>
        </select>
      </label>
      <div class="field" data-for-type="timer">
        <span class="field__label">時間（分）</span>
        <span class="field__row timer-fields">
          <label data-timer-mode="pomodoro">作業 <input class="input input--number" type="number" name="timerWork" min="1" max="180"></label>
          <label data-timer-mode="pomodoro">休憩 <input class="input input--number" type="number" name="timerShort" min="1" max="60"></label>
          <label data-timer-mode="pomodoro">長い休憩 <input class="input input--number" type="number" name="timerLong" min="1" max="120"></label>
          <label data-timer-mode="pomodoro">長い休憩までの回数 <input class="input input--number" type="number" name="timerLongEvery" min="2" max="8"></label>
          <label data-timer-mode="timer">タイマー <input class="input input--number" type="number" name="timerMinutes" min="1" max="600"></label>
        </span>
      </div>
      <label class="checkbox" data-for-type="timer">
        <input type="checkbox" name="timerAutoNext"> ポモドーロで、終わったら次（休憩・作業）を自動で始める
      </label>
      <label class="checkbox" data-for-type="timer">
        <input type="checkbox" name="timerSound"> 終わったら音を鳴らす
      </label>

      <!-- 世界時計 -->
      <label class="field" data-for-type="worldclock">
        <span class="field__label">都市（1 行に「表示名=タイムゾーン」。例：パリ=Europe/Paris、シドニー=Australia/Sydney）</span>
        <textarea class="input" name="worldZones" rows="5" spellcheck="false"></textarea>
        <span class="field__hint">タイムゾーンの名前は <a href="https://en.wikipedia.org/wiki/List_of_tz_database_time_zones" target="_blank" rel="noopener noreferrer">一覧（英語）</a> の「TZ identifier」で調べられます</span>
      </label>

      <!-- 習慣トラッカー -->
      <label class="field" data-for-type="habit">
        <span class="field__label">表示する日数</span>
        <select class="input" name="habitDays">
          <option value="7">7 日（1 週間）</option>
          <option value="14">14 日（2 週間）</option>
        </select>
      </label>

      <!-- GitHub -->
      <fieldset class="fieldset" data-for-type="github">
        <legend class="field__label">表示する一覧</legend>
        <label class="checkbox"><input type="checkbox" name="githubLists" value="review"> レビューを頼まれているプルリクエスト</label>
        <label class="checkbox"><input type="checkbox" name="githubLists" value="mine"> 自分が作った、開いているプルリクエスト</label>
        <label class="checkbox"><input type="checkbox" name="githubLists" value="assigned"> 自分が担当の、開いている Issue</label>
      </fieldset>
      <label class="field" data-for-type="github">
        <span class="field__label">一覧ごとの表示件数</span>
        <select class="input" name="githubLimit">
          <option value="5">5 件</option>
          <option value="10">10 件</option>
          <option value="20">20 件</option>
        </select>
      </label>
      <div class="field" data-for-type="github">
        <span class="field__hint" id="github-token-state"></span>
        <span class="field__row">
          <button type="button" class="button button--small button--danger" id="github-token-clear">この端末のトークンを削除</button>
        </span>
      </div>

      <label class="checkbox" data-for-type="note">
        <input type="checkbox" name="noteMarkdown"> Markdown で書式を付けて表示する（見出し・箇条書き・チェックボックス・リンクなど）
      </label>

      <label class="field" data-for-type="photo">
        <span class="field__label">写真の見せ方</span>
        <select class="input" name="photoFit">
          <option value="cover">枠いっぱいに表示（はみ出す部分は切り取る）</option>
          <option value="contain">写真全体を表示（余白ができる）</option>
        </select>
      </label>
      <label class="field" data-for-type="photo">
        <span class="field__label">自動で切り替える間隔</span>
        <select class="input" name="photoInterval">
          <option value="0">切り替えない</option>
          <option value="5">5 秒</option>
          <option value="10">10 秒</option>
          <option value="30">30 秒</option>
          <option value="60">1 分</option>
          <option value="300">5 分</option>
        </select>
      </label>

      <label class="field" data-for-type="clock">
        <span class="field__label">タイムゾーン（空欄でブラウザの設定）</span>
        <input class="input" name="timeZone" placeholder="Asia/Tokyo">
      </label>

      <div class="dialog__actions">
        <button type="button" class="button button--danger" id="widget-delete">削除</button>
        <span class="dialog__spacer"></span>
        <button value="cancel" class="button" formnovalidate>キャンセル</button>
        <button value="ok" class="button button--primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- リンクの追加・編集 -->
  <dialog class="dialog" id="link-dialog">
    <form method="dialog" class="dialog__body" id="link-form">
      <h2 class="dialog__title" id="link-dialog-title">リンク</h2>

      <label class="field">
        <span class="field__label">URL</span>
        <input class="input" name="url" type="url" required placeholder="https://">
      </label>
      <label class="field">
        <span class="field__label">表示名</span>
        <input class="input" name="title" maxlength="80" placeholder="空欄ならドメイン名">
      </label>
      <label class="field">
        <span class="field__label">アイコン（絵文字か画像 URL。空欄でサイトのファビコン）</span>
        <input class="input" name="icon" maxlength="300">
      </label>
      <label class="field">
        <span class="field__label">メモ（任意）</span>
        <input class="input" name="description" maxlength="200">
      </label>

      <div class="dialog__actions">
        <button type="button" class="button button--danger" id="link-delete">削除</button>
        <span class="dialog__spacer"></span>
        <button value="cancel" class="button" formnovalidate>キャンセル</button>
        <button value="ok" class="button button--primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 1 行の文字入力（ToDo やカテゴリーの名前など） -->
  <dialog class="dialog" id="text-dialog">
    <form method="dialog" class="dialog__body" id="text-form">
      <h2 class="dialog__title" id="text-dialog-title"></h2>
      <label class="field">
        <span class="field__label" id="text-dialog-label"></span>
        <input class="input" name="text" maxlength="200" required>
      </label>
      <div class="dialog__actions">
        <span class="dialog__spacer"></span>
        <button value="cancel" class="button" formnovalidate>キャンセル</button>
        <button value="ok" class="button button--primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 一時的なお知らせ -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- 設定 -->
  <dialog class="dialog dialog--wide" id="settings-dialog">
    <form method="dialog" class="dialog__body" id="settings-form">
      <h2 class="dialog__title">設定</h2>

      <label class="field">
        <span class="field__label">ダッシュボードの名前</span>
        <input class="input" name="title" maxlength="80">
      </label>
      <label class="field">
        <span class="field__label">配色</span>
        <select class="input" name="mode">
          <option value="auto">OS の設定に合わせる</option>
          <option value="light">ライト</option>
          <option value="dark">ダーク</option>
        </select>
      </label>
      <fieldset class="fieldset fieldset--plain">
        <legend class="field__label">テーマ</legend>
        <div class="theme-picker" id="theme-picker"></div>
      </fieldset>
      <label class="field">
        <span class="field__label">表示密度</span>
        <select class="input" name="density">
          <option value="normal">標準</option>
          <option value="compact">コンパクト（余白を詰める）</option>
        </select>
      </label>
      <label class="field">
        <span class="field__label">ウィジェットの高さ</span>
        <select class="input" name="layout">
          <option value="tile">タイル（各ウィジェットの「高さ（段）」でマス目にそろえる）</option>
          <option value="flow">中身に合わせる（段の指定を使わない）</option>
        </select>
      </label>
      <label class="checkbox">
        <input type="checkbox" name="openInNewTab"> リンクを新しいタブで開く
      </label>
      <label class="checkbox">
        <input type="checkbox" name="useFavicons"> アイコン未設定のリンクにサイトのファビコンを表示する
      </label>
      <label class="checkbox">
        <input type="checkbox" name="autoRenewGoogle"> Google カレンダー・Gmail の連携を、画面をクリックしたときに自動で延長する（ポップアップが一瞬開きます）
      </label>

      <fieldset class="fieldset">
        <legend class="field__label">バックアップ</legend>
        <div class="field__row">
          <button type="button" class="button" id="export-button">書き出す（JSON）</button>
          <label class="button">
            読み込む<input type="file" accept="application/json,.json" id="import-input" hidden>
          </label>
          <button type="button" class="button button--danger" id="reset-button">初期状態に戻す</button>
        </div>
      </fieldset>

      <div class="dialog__actions">
        <span class="dialog__spacer"></span>
        <button value="cancel" class="button" formnovalidate>キャンセル</button>
        <button value="ok" class="button button--primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/Sortable.min.js"></script>
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
