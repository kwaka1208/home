<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!--
    CSS の読み込み順。@layer で優先順位を固定しているので、
    custom.css に書いたものは詳細度を気にせず必ず勝ちます。
  -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-header__title" id="dashboard-title">Dashboard</h1>

    <div class="app-header__search">
      <input type="search" id="filter" class="input input--search"
             placeholder="リンクを絞り込む（/ キー）" aria-label="リンクを絞り込む" autocomplete="off">
    </div>

    <div class="app-header__actions">
      <span class="save-status" id="save-status" role="status" aria-live="polite"></span>
      <button type="button" class="button" id="edit-toggle" aria-pressed="false">
        <span class="button__icon" aria-hidden="true">✎</span><span class="button__label">編集</span>
      </button>
      <button type="button" class="button button--icon" id="settings-open" aria-label="設定" title="設定">⚙</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main class="dashboard" id="dashboard" aria-live="polite"></main>

  <footer class="app-footer">
    <span id="user-email"></span>
  </footer>

  <!-- ウィジェットの追加・編集 -->
  <dialog class="dialog" id="widget-dialog">
    <form method="dialog" class="dialog__body" id="widget-form">
      <h2 class="dialog__title" id="widget-dialog-title">ウィジェット</h2>

      <label class="field">
        <span class="field__label">種類</span>
        <select class="input" name="type">
          <option value="links">リンク集</option>
          <option value="note">メモ</option>
          <option value="clock">時計</option>
          <option value="search">Web 検索</option>
          <option value="embed">埋め込み（カレンダーなど）</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">タイトル</span>
        <input class="input" name="title" maxlength="80">
      </label>

      <label class="field">
        <span class="field__label">幅</span>
        <select class="input" name="size">
          <option value="s">S（1列）</option>
          <option value="m">M（2列）</option>
          <option value="l">L（3列）</option>
          <option value="xl">XL（全幅）</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">アクセントカラー（任意）</span>
        <span class="field__row">
          <input class="input input--color" type="color" name="accent">
          <label class="checkbox"><input type="checkbox" name="useAccent"> 使う</label>
        </span>
      </label>

      <label class="field" data-for-type="links">
        <span class="field__label">表示形式</span>
        <select class="input" name="view">
          <option value="list">リスト</option>
          <option value="grid">タイル</option>
        </select>
      </label>

      <label class="field" data-for-type="search">
        <span class="field__label">検索 URL（%s が検索語に置き換わります）</span>
        <input class="input" name="searchUrl" placeholder="https://www.google.com/search?q=%s">
      </label>

      <label class="field" data-for-type="embed">
        <span class="field__label">埋め込む URL</span>
        <input class="input" name="embedUrl" type="url" placeholder="https://calendar.google.com/calendar/embed?src=...">
      </label>
      <label class="field" data-for-type="embed">
        <span class="field__label">高さ（px）</span>
        <input class="input" name="height" type="number" min="120" max="1600" step="10">
      </label>

      <label class="field" data-for-type="clock">
        <span class="field__label">タイムゾーン（空欄でブラウザの設定）</span>
        <input class="input" name="timeZone" placeholder="Asia/Tokyo">
      </label>

      <div class="dialog__actions">
        <button type="button" class="button button--danger" id="widget-delete">削除</button>
        <span class="dialog__spacer"></span>
        <button value="cancel" class="button" formnovalidate>キャンセル</button>
        <button value="ok" class="button button--primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- リンクの追加・編集 -->
  <dialog class="dialog" id="link-dialog">
    <form method="dialog" class="dialog__body" id="link-form">
      <h2 class="dialog__title" id="link-dialog-title">リンク</h2>

      <label class="field">
        <span class="field__label">URL</span>
        <input class="input" name="url" type="url" required placeholder="https://">
      </label>
      <label class="field">
        <span class="field__label">表示名</span>
        <input class="input" name="title" maxlength="80" placeholder="空欄ならドメイン名">
      </label>
      <label class="field">
        <span class="field__label">アイコン（絵文字か画像 URL。空欄でサイトのファビコン）</span>
        <input class="input" name="icon" maxlength="300">
      </label>
      <label class="field">
        <span class="field__label">メモ（任意）</span>
        <input class="input" name="description" maxlength="200">
      </label>

      <div class="dialog__actions">
        <button type="button" class="button button--danger" id="link-delete">削除</button>
        <span class="dialog__spacer"></span>
        <button value="cancel" class="button" formnovalidate>キャンセル</button>
        <button value="ok" class="button button--primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 設定 -->
  <dialog class="dialog" id="settings-dialog">
    <form method="dialog" class="dialog__body" id="settings-form">
      <h2 class="dialog__title">設定</h2>

      <label class="field">
        <span class="field__label">ダッシュボードの名前</span>
        <input class="input" name="title" maxlength="80">
      </label>
      <label class="field">
        <span class="field__label">配色</span>
        <select class="input" name="mode">
          <option value="auto">OS の設定に合わせる</option>
          <option value="light">ライト</option>
          <option value="dark">ダーク</option>
        </select>
      </label>
      <label class="field">
        <span class="field__label">テーマ</span>
        <select class="input" name="preset" id="preset-select"></select>
      </label>
      <label class="checkbox">
        <input type="checkbox" name="openInNewTab"> リンクを新しいタブで開く
      </label>
      <label class="checkbox">
        <input type="checkbox" name="useFavicons"> アイコン未設定のリンクにサイトのファビコンを表示する
      </label>

      <fieldset class="fieldset">
        <legend class="field__label">バックアップ</legend>
        <div class="field__row">
          <button type="button" class="button" id="export-button">書き出す（JSON）</button>
          <label class="button">
            読み込む<input type="file" accept="application/json,.json" id="import-input" hidden>
          </label>
          <button type="button" class="button button--danger" id="reset-button">初期状態に戻す</button>
        </div>
      </fieldset>

      <div class="dialog__actions">
        <span class="dialog__spacer"></span>
        <button value="cancel" class="button" formnovalidate>キャンセル</button>
        <button value="ok" class="button button--primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/Sortable.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
