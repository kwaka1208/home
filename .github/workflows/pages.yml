# public/ フォルダの中身を GitHub Pages に公開する
#
# 事前に、リポジトリの Settings → Pages → Build and deployment → Source を
# 「GitHub Actions」にしておいてください（README の手順 2）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # テンプレートとして公開しているリポジトリ（本家）では動かさない。
    # テンプレートから作ったあなたのリポジトリはテンプレート扱いではないので、ここは通常どおり動きます。
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
